syntax = "proto3";

package UiAutomation;

service UiAutomationService {
  // Finds an element based on a condition starting from a root (or desktop if empty)
  rpc FindElement (FindElementRequest) returns (ElementResponse);
  
  // Performs an action (Invoke, Click, etc.) on an element
  rpc PerformAction (PerformActionRequest) returns (PerformActionResponse);
  
  // Gets a specific property of an element
  rpc GetProperty (GetPropertyRequest) returns (GetPropertyResponse);

  // Opens an application (Helper utility)
  rpc OpenApp (AppRequest) returns (OpenAppResponse);
    
  // Closes an application (Helper utility)
  rpc CloseApp (AppRequest) returns (PerformActionResponse);

  // Closes an application by Process ID
  rpc CloseAppByProcessId (CloseAppByProcessIdRequest) returns (PerformActionResponse);

  // Takes a screenshot of the application window (Helper utility)
  rpc TakeScreenshot (ScreenshotRequest) returns (ScreenshotResponse);

  // Reflection API: query metadata about automation properties, patterns, control types and per-element supported patterns/properties
  rpc Reflect (ReflectionRequest) returns (ReflectionResponse);

  // Gets immediate children of an element
  rpc GetChildren (GetChildrenRequest) returns (ElementListResponse);

  // Polls for an element matching a condition until it appears or the timeout elapses.
  // One round trip replaces the client-side "retry find_element" loop (slow + token-hungry for LLM agents).
  rpc WaitForElement (WaitForElementRequest) returns (ElementResponse);

  // Sends keys to the active application
  rpc SendKeys (SendKeysRequest) returns (PerformActionResponse);

  // -- Layer Server Methods --

  // Returns the application structure as a JSON string
  rpc GetAppStructure (AppStructureRequest) returns (AppStructureResponse);
  
  // Performs an action and returns the updated application structure
  rpc PerformActionWithStructure (PerformActionRequest) returns (AppStructureResponse);

  // Clears the server-side element cache (teardown / memory management)
  rpc ClearCache (ClearCacheRequest) returns (PerformActionResponse);
}

// -- Common --

message ElementResponse {
    string runtime_id = 1; // Used as handle for subsequent calls
    string name = 2;
    string automation_id = 3;
    string class_name = 4;
    string control_type = 5;
    bool success = 6;     // false when the element was not found / blocked (runtime_id will be empty)
    string message = 7;   // diagnostic detail when success is false
}

message ElementListResponse {
    repeated ElementResponse elements = 1;
    bool success = 2;
    string message = 3;
}

// -- Finding --

message FindElementRequest {
  string start_runtime_id = 1; // Empty for Desktop
  Condition condition = 2;
  TreeScope scope = 3;
}

message GetChildrenRequest {
    string runtime_id = 1; // Optional, defaults to desktop if empty
}

message WaitForElementRequest {
  string start_runtime_id = 1;  // Empty for Desktop
  Condition condition = 2;
  TreeScope scope = 3;
  int32 timeout_ms = 4;         // Total wait budget. 0 = server default (10000); clamped to <= 120000.
  int32 poll_interval_ms = 5;   // Delay between probes. 0 = server default (250); clamped to [50, 5000].
}

enum TreeScope {
    ELEMENT = 0;
    CHILDREN = 1;
    DESCENDANTS = 2;
    SUBTREE = 3;
    PARENT = 4;
    ANCESTORS = 5;
}

message Condition {
    oneof condition_type {
        PropertyCondition property_condition = 1;
        BoolCondition and_condition = 2;
        BoolCondition or_condition = 3;
        Condition not_condition = 4;
        bool true_condition = 5; // Matches everything
    }
}

message PropertyCondition {
    string property_name = 1; // e.g. "Name", "AutomationId", "ControlType"
    string property_value = 2;
    PropertyType property_type = 3; // Hint for parsing value
}

enum PropertyType {
    STRING = 0;
    BOOL = 1;
    INT = 2;
}

message BoolCondition {
    repeated Condition conditions = 1;
}

// -- Actions --

message PerformActionRequest {
    string runtime_id = 1;
    ActionType action = 2;
    repeated string arguments = 3; // For SetValue etc.
    StructureOptions structure_options = 4; // Only used by PerformActionWithStructure (ignored by PerformAction)
}

// Per-request overrides for the app-structure tree build. Every field is optional;
// unset fields fall back to the server's Features:AppStructure defaults.
message StructureOptions {
    int32 max_depth = 1;                  // > 0 overrides the depth cap for this request
    int32 max_nodes = 2;                  // > 0 overrides the node cap for this request
    optional bool include_offscreen = 3;  // set to override offscreen filtering for this request
    string scope_runtime_id = 4;          // non-empty: build the tree under this element instead of the window root
    bool diff_mode = 5;                   // true: return only nodes added/changed/removed since the previous build of this process
}

enum ActionType {
    INVOKE = 0;
    TOGGLE = 1;
    SELECT = 2;
    EXPAND_COLLAPSE = 3;
    SET_VALUE = 4;
    SET_FOCUS = 5;
    CLICK = 6; // Legacy: invokes via InvokePattern, falling back to a simulated left-click. Prefer INVOKE or LeftClick.
    Move = 7; // Move cursor
    MoveTo = 8; // Move cursor to element's clickable point
    LeftClick = 9; // Simulated left click. With no element (empty runtime_id) and arguments [x, y] clicks at those screen coordinates; otherwise clicks at the current cursor position.
    RightClick = 10; // Simulated right click. With no element (empty runtime_id) and arguments [x, y] clicks at those screen coordinates; otherwise clicks at the current cursor position.
    LeftDown = 11; // Simulated left button down
    LeftUp = 12; // Simulated left button up
    RightDown = 13; // Simulated right button down
    RightUp = 14; // Simulated right button up
    MousWeelScroll = 15; // Simulated mouse wheel scroll, argument: delta
    MouseMiddleClick = 16; // Simulated middle click
    DoubleClick = 17; // Simulated double click. With no element (empty runtime_id) requires arguments [x, y] — double-clicks at those screen coordinates.
}

message PerformActionResponse {
    bool success = 1;
    string message = 2;
}

// -- Properties --

message GetPropertyRequest {
    string runtime_id = 1;
    string property_name = 2;
}

message GetPropertyResponse {
    bool success = 1;
    string value = 2;
    string message = 3;
}

// -- Reflection API --

enum ReflectionTarget {
    AUTOMATION_PROPERTIES = 0; // All well-known AutomationProperty static fields (NameProperty, ...)
    PATTERNS = 1;              // All well-known AutomationPattern entries
    CONTROL_TYPES = 2;         // ControlType.* static fields
    ELEMENT_SUPPORTED_PATTERNS = 3; // Patterns supported by a specific element (use runtime_id)
    ELEMENT_SUPPORTED_PROPERTIES = 4; // Properties supported by a specific element (use runtime_id)
}

message ReflectionRequest {
    ReflectionTarget target = 1;
    string runtime_id = 2; // Optional for element-specific targets
}

message ReflectionEntry {
    string name = 1;
    string value = 2; // free-form value (id, programmatic name, etc.)
}

message ReflectionResponse {
    repeated ReflectionEntry entries = 1;
    bool success = 2;
    string message = 3;
}

// -- Utils --

message AppRequest {
    string app_name = 1;
    string arguments = 2;
}

message CloseAppByProcessIdRequest {
    int32 process_id = 1;
}

message OpenAppResponse {
    bool success = 1;
    string message = 2;
    int32 process_id = 3;
}

message SendKeysRequest {
    string keys = 1;
    bool wait = 2; // default true
    string runtime_id = 3; // Optional: focus this element before sending (targets a specific control instead of whatever currently has focus)
}

message ScreenshotRequest {
    string runtime_id = 1; // Optional
    ScreenshotMode mode = 2;
    int32 process_id = 3; // Optional, used for Window mode if runtime_id is missing
}

enum ScreenshotMode {
    SCREENSHOT_MODE_ELEMENT = 0;
    SCREENSHOT_MODE_WINDOW = 1;
    // SCREEN = 2; // Potential future expansion
}

message ScreenshotResponse {
    bytes image_data = 1;
    bool success = 2;
    string message = 3;
}

// -- Layer Server Messages --

message AppStructureRequest {
    string app_name = 1;
    int32 process_id = 2;
    bool use_process_id = 3; // if true, use process_id, else app_name
    string arguments = 4; // For launching if not open (optional)
    StructureOptions structure_options = 5;
}

message AppStructureResponse {
    string json_structure = 1;
    bool success = 2;
    string message = 3;
}

// -- Cache Management --

message ClearCacheRequest {
    int32 process_id = 1;    // Optional: clear only this process's cache (0 = clear all)
    string app_name = 2;     // Optional: clear by app name (like CloseApp)
}
